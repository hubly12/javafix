name: test and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            out: javafix-windows-x64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            out: javafix-windows-arm64.exe
          - os: macos-latest
            target: universal
            out: javafix-macos-universal.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --locked --release --target ${{ matrix.target }}
          mkdir -p dist && cp target/${{ matrix.target }}/release/javafix.exe dist/${{ matrix.out }}
      - name: build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin
          # A bare binary loses its executable bit when downloaded and Finder opens it in TextEdit.
          # A zip keeps the bit, and the .command name makes a double-click run it in Terminal.
          mkdir -p dist/javafix-macos
          lipo -create -output dist/javafix-macos/javafix.command target/x86_64-apple-darwin/release/javafix target/aarch64-apple-darwin/release/javafix
          chmod 755 dist/javafix-macos/javafix.command
          codesign --force --sign - dist/javafix-macos/javafix.command
          (cd dist && ditto -c -k --keepParent javafix-macos ${{ matrix.out }})
          # Check what users get: unpacked file is executable, universal, and runs.
          mkdir unpacked && ditto -x -k dist/${{ matrix.out }} unpacked
          test -x unpacked/javafix-macos/javafix.command
          lipo -archs unpacked/javafix-macos/javafix.command
          codesign --verify --verbose unpacked/javafix-macos/javafix.command
          unpacked/javafix-macos/javafix.command --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum javafix-* > SHA256SUMS && cat SHA256SUMS
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes "See README. Verify downloads with SHA256SUMS." javafix-* SHA256SUMS
