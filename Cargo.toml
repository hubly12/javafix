[package]
name = "javafix"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "Block-list based stopgap for CVE-2026-91403: finds Java runtimes on Windows and macOS, checks them (optionally with a live TLS test) and, with consent, blocks the 16 affected certificates."
license = "MIT"
readme = "README.md"
repository = "https://github.com/hubly12/javafix"
keywords = ["java", "security", "cve", "certificates", "minecraft"]
categories = ["command-line-utilities"]

# No dependencies on purpose: the whole tool can be audited by reading src/.
[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
